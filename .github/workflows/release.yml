name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      # 提权 helper 二进制不入库（.gitignore），由 build:helper 现编现打：mac(helper/) + win(helper-win/)。
      # 必须在 mac 与 win 两个 runner 都装 Go，否则该平台 package 缺 helper 二进制 → 安装提权助手「二进制缺失」(issue #57)。
      - name: Setup Go (提权 helper, mac + win)
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        run: |
          # electron-builder.json mac.target.arch = [arm64, x64] → 两个架构的 .app 都已构建，但
          # 多架构下 electron-builder 会把其中一个架构放进【无后缀】的 dist-package/mac/
          # （v4.1.0 实测：x64 落 dist-package/mac、arm64 落 dist-package/mac-arm64），各自含对应架构的提权 helper。
          # 故此处按 arch 后缀目录优先、回退无后缀目录，并用 lipo 校验确属目标架构；缺则【报错失败】（不再静默跳过，
          # 避免 v4.1.0 那样绿灯却漏发 mac-x64 包）。
          VERSION=${GITHUB_REF#refs/tags/v}
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/FlowZ-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/FlowZ.app" "dist-package/mac/FlowZ.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(ls "$CAND"/Contents/MacOS/* 2>/dev/null | head -1)
              if [ -n "$EXE" ] && lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"; break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 FlowZ.app（查了 dist-package/mac-${ARCH}/ 与 dist-package/mac/）——发布将缺 mac-${ARCH} 包，请检查 package:mac 的 electron-builder --${ARCH} 产出。"
              exit 1
            fi
            echo "Using ${ARCH} app bundle: $APP_PATH"
            echo "Ad-hoc deep signing ${ARCH} app bundle (fix Team ID mismatch)..."
            codesign --force --deep --sign - "$APP_PATH"

            echo "Creating ${ARCH} DMG..."
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            hdiutil create -volname "FlowZ ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" \
              -ov -format UDZO \
              "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            echo "Created: $DMG_PATH"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.exe
            dist-package/*.dmg
            dist-package/*.AppImage
            dist-package/*.deb
          retention-days: 5

  create-release:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        # Release notes 单一来源：generate_release_notes 由 GitHub 自动从 PR 列表生成「## What's Changed」+
        # Full Changelog。不再额外注入 body（曾与 generate_release_notes 叠加导致两个 ## What's Changed 且
        # 与 PR 标题重复）；无需维护 CHANGELOG.md。
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
