name: 功能建议 / Feature request
description: 提一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        一个 issue 只提一个建议。使用求助请走 [Discussions](https://github.com/dododook/FlowZ/discussions)。
  - type: textarea
    id: problem
    attributes:
      label: 这个建议解决什么问题 / 场景
      description: 描述你遇到的实际场景或痛点，而不是直接跳到方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / 方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（选填）
      description: 你试过或考虑过的其他做法
